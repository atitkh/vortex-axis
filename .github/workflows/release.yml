name: release

# A version tag (v0.41.0) builds everything a person needs: the board firmware, the Windows desktop app, the
# Quest panel client and the Axis image with all three inside it, and puts them on a release. Runs on GitHub, and on a Gitea runner with
# the label "linux" (there the image is built and checked but not pushed; the release gets the files).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  # For the browser flasher on GitHub Pages (Settings > Pages > Source: GitHub Actions).
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'linux' }}
    env:
      ON_GITHUB: ${{ github.server_url == 'https://github.com' }}
    steps:
      - uses: actions/checkout@v4

      - name: Versions
        id: v
        run: |
          axis=$(node -p "require('./package.json').version")
          # Each board type counts its own firmware version (scripts/firmware-version.mjs).
          firmware=$(for b in firmware/waveshare-amoled-1.8 firmware/waveshare-amoled-1.75; do printf '%s %s, ' "$(basename "$b")" "$(node scripts/firmware-version.mjs "$b")"; done | sed 's/, $//')
          desktop=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' clients/windows-desktop/Directory.Build.props)
          echo "axis=$axis" >> "$GITHUB_OUTPUT"
          echo "firmware=$firmware" >> "$GITHUB_OUTPUT"
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          quest=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" clients/quest-client/app/build.gradle)
          echo "quest=$quest" >> "$GITHUB_OUTPUT"
          echo "Axis $axis, board firmware $firmware, desktop app $desktop, Quest client $quest"
          # A tag has to name the version it is: v plus the top-level package.json's.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$axis" ]; then
            echo "the tag ${GITHUB_REF_NAME} is not v$axis (package.json)"; exit 1
          fi

      # Board firmware (PlatformIO), for each board type in firmware/.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Board firmware
        run: |
          pip install --quiet platformio==6.1.19 esptool
          mkdir -p out bundled/firmware
          echo "[" > bundled/firmware/manifest.json
          first=1
          for board in firmware/waveshare-amoled-1.8 firmware/waveshare-amoled-1.75; do
            type=$(basename "$board")
            fw=$(node scripts/firmware-version.mjs "$board")
            pio run -d "$board"
            build=$(ls -d "$board"/.pio/build/*/ | head -1)
            # For updates over Wi-Fi: the application image. For a board's first flash: the factory image.
            cp "$build/firmware.bin" "bundled/firmware/$type.bin"
            # The factory image with its header set for this board's flash size (scripts/factory-image.mjs says why).
            node scripts/factory-image.mjs "$board" "bundled/firmware/$type.factory.bin"
            cp "$build/firmware.bin" "out/firmware-$type-$fw.bin"
            cp "bundled/firmware/$type.factory.bin" "out/firmware-$type-$fw-factory.bin"
            [ $first = 1 ] || echo "," >> bundled/firmware/manifest.json
            first=0
            printf '{"type":"%s","version":"%s","file":"%s.bin","factory":"%s.factory.bin"}' "$type" "$fw" "$type" "$type" >> bundled/firmware/manifest.json
          done
          echo "]" >> bundled/firmware/manifest.json
          cat bundled/firmware/manifest.json

      # The browser flasher as a page of its own, for GitHub Pages (every Axis also serves it, at /flash).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Browser flasher
        run: |
          node scripts/fetch-esp-web-tools.mjs
          node scripts/make-flasher.mjs firmware/waveshare-amoled-1.8 firmware/waveshare-amoled-1.75 out/flasher
          ls -la out/flasher
      - uses: actions/upload-pages-artifact@v3
        if: env.ON_GITHUB == 'true'
        with:
          path: out/flasher

      # The Windows desktop app: one self-contained exe, built on Linux (it only runs on Windows).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Windows desktop app
        run: |
          dotnet publish clients/windows-desktop/VortexDesktop -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -o .out/win-x64 -nologo -v q
          mkdir -p bundled/desktop
          cp .out/win-x64/VortexAxisDesktop.exe bundled/desktop/
          printf '{"version":"%s","builtAt":"%s"}\n' "${{ steps.v.outputs.desktop }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > bundled/desktop/version.json
          cp .out/win-x64/VortexAxisDesktop.exe "out/VortexAxisDesktop-${{ steps.v.outputs.desktop }}.exe"

      # The Quest panel client (experimental): the APK, built in Docker with its tests run first. Debug-signed, to be
      # installed by hand (adb, or the headset's Unknown Sources); a headset on it then updates from Axis. Updates only
      # install over the last build when the signing key is the same, so keep a key in the secret QUEST_KEYSTORE_B64
      # (base64 of a debug.keystore); without it every release has a fresh key.
      - name: Quest panel client
        env:
          QUEST_KEYSTORE_B64: ${{ secrets.QUEST_KEYSTORE_B64 }}
        run: |
          AXIS_QUEST_OUT=bundled/quest scripts/build-quest-client.sh
          cp bundled/quest/quest-client.apk "out/quest-client-${{ steps.v.outputs.quest }}.apk"

      # The Axis image, with the firmware and the apps in it.
      - uses: docker/setup-qemu-action@v3
        if: env.ON_GITHUB == 'true'
      - uses: docker/setup-buildx-action@v3
        if: env.ON_GITHUB == 'true'
      - uses: docker/login-action@v3
        if: env.ON_GITHUB == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Axis image
        run: |
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          tags="-t $image:${{ steps.v.outputs.axis }} -t $image:latest"
          if [ "$ON_GITHUB" = "true" ]; then
            # amd64 and arm64 (a Raspberry Pi or an Apple Silicon Mac can run it too), pushed.
            docker buildx build --platform linux/amd64,linux/arm64 --build-arg AXIS_COMMIT="${GITHUB_SHA::7}" $tags --push .
          else
            # Here only built, to prove the image builds with everything in it.
            docker build --build-arg AXIS_COMMIT="${GITHUB_SHA::7}" -t vortex-axis:release-check .
            docker run --rm --entrypoint sh vortex-axis:release-check -c 'ls -la bundled/firmware bundled/desktop bundled/quest flasher flasher/esp-web-tools | head -40 && cat bundled/firmware/manifest.json'
            docker rmi vortex-axis:release-check > /dev/null
          fi

      # The speech services' image (recognition, synthesis, voiceprints). Built only where it is pushed: it is
      # large, and changes rarely.
      - name: Speech image
        if: env.ON_GITHUB == 'true'
        run: |
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')-speech"
          docker buildx build --platform linux/amd64,linux/arm64 -t "$image:${{ steps.v.outputs.axis }}" -t "$image:latest" --push speech

      - name: Release notes
        run: |
          # The changelog's newest section.
          awk 'NR>1 && /^## /{n++} n==1{print} n>1{exit}' CHANGELOG.md | sed '1{/^## /d}' > out/notes.md
          {
            echo ""
            echo "Axis ${{ steps.v.outputs.axis }}, board firmware ${{ steps.v.outputs.firmware }}, desktop app ${{ steps.v.outputs.desktop }}, Quest client ${{ steps.v.outputs.quest }} (experimental, sideload: \`adb install\` or Unknown Sources)."
            echo "Image: \`ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]'):${{ steps.v.outputs.axis }}\` (the firmware and both apps are inside it)."
          } >> out/notes.md
          ls -la out

      - name: Release on GitHub
        if: env.ON_GITHUB == 'true' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          body_path: out/notes.md
          files: |
            out/*.bin
            out/*.exe
            out/*.apk

      - name: Release on Gitea
        if: env.ON_GITHUB != 'true' && github.ref_type == 'tag'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          body=$(python3 -c 'import json,sys;print(json.dumps({"tag_name":sys.argv[1],"name":sys.argv[1],"body":open("out/notes.md").read()}))' "${GITHUB_REF_NAME}")
          id=$(curl -sf -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" -d "$body" "$api/releases" | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
          for f in out/*.bin out/*.exe out/*.apk; do
            curl -sf -X POST -H "Authorization: token $TOKEN" -F "attachment=@$f" "$api/releases/$id/assets?name=$(basename "$f")" > /dev/null
            echo "attached $(basename "$f")"
          done

  # Publishes the flasher page. GitHub only: it needs Pages, which serves it over https as USB access requires.
  flasher:
    if: github.server_url == 'https://github.com'
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
