; Waveshare ESP32-S3-Touch-AMOLED-1.8 (ESP32-S3R8, 16 MB flash, 8 MB PSRAM)

[env:waveshare-amoled-1_8]
; pioarduino tracks Arduino core 3.x. The display library needs it; the official
; espressif32 platform stops at core 2.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1

monitor_speed = 115200
upload_speed = 921600

board_build.flash_size = 16MB
; Both of these as well, or the bootloader PlatformIO builds says 8 MB in its header (the generic board's
; size). A cable upload corrects that on the way, so it goes unnoticed; a browser flasher does not, and the
; board then refuses its own partition table and never starts.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.psram_type = opi
; Without qio_opi, PSRAM allocations return nothing and say nothing.
board_build.arduino.memory_type = qio_opi
; Two app slots from the start, so updates over Wi-Fi can be added without re-flashing by cable.
board_build.partitions = default_16MB.csv

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    ; Activates the esp-nn int8 kernels on the S3, which is what makes the wake word model cheap enough to run all the time.
    -D ESP_NN

; The wake word model is turned into a header at build time. See tools/model_header.py.
custom_wake_model = hey_vortex
extra_scripts = pre:../tools/model_header.py

; TFLite Micro and the audio frontend are vendored in ../lib (see their PATCHES.md files).
lib_extra_dirs = ../lib

lib_deps =
    ; The shared client core, straight from this repository.
    axis-client=symlink://../common
    ; Wake word detector.
    axis-wake=symlink://../wake
    moononournation/GFX Library for Arduino@1.6.6
    ; Pictures from agent replies arrive as baseline JPEGs sized for the screen.
    bitbank2/JPEGDEC@1.8.4
