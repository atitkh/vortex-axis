services:
  vortex-axis:
    build: .
    image: vortex-axis:local
    container_name: vortex-axis
    restart: unless-stopped
    env_file: .env
    environment:
      AXIS_PORT: "8440"
    # Lets the container reach services on the Docker host, such as the gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${AXIS_PORT:-8440}:8440"
    volumes:
      - vortex-axis-data:/data

volumes:
  vortex-axis-data:
