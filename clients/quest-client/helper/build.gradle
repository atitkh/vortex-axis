plugins {
    id 'com.android.application'
}

// The fast engine's helper: a second APK, carried inside the app as an asset (see app/build.gradle) and installed
// by it. It has no window: an instrumentation that targets this same package (`am instrument` force-stops its
// target, so the app cannot be its own), started by the app through adb as the shell user.
android {
    namespace 'dev.vortexaxis.quest.helper'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.vortexaxis.quest.helper'
        minSdk 29
        targetSdk 32
        // In step with the app: the app expects the helper it carries to say its own version.
        versionCode 15
        versionName '0.4.0'
    }

    sourceSets {
        // The wire, the router and the handle table are plain Java in ../core, tested on a JVM.
        main.java.srcDirs += '../core/src'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures { buildConfig true }

    lint { checkReleaseBuilds false; abortOnError false }
}
